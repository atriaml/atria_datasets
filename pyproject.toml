[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atria_datasets"
version = "0.0.0"                                                                                                    
description = "Atria Datasets: A collection of datasets for training and evaluating AI agents in the Atria framework."
readme = "README.md"
requires-python = ">3.13"
license = { file = "LICENSE.txt" }
authors = [{ name = "Saifullah", email = "saifullah.saifullah@dfki.de" }]
dependencies = [
    "atria-core",
    "boto3>=1.39.4",
    "click>=8.1.7",
    "datadings",
    "datasets==3.4",
    "deltalake>=1.0.2",
    "docile-benchmark>=0.3.4",
    "editdistance>=0.8.1",
    "einops>=0.8.1",
    "filelock>=3.18.0",
    "fire>=0.7.0",
    "gdown>=5.2.0",
    "hydra-core==1.3.2",
    "hydra_zen==0.14.0",
    "imagesize>=1.4.1",
    "lakefs>=0.11.1",
    "lazy-loader>=0.4",
    "more-itertools>=11.1.0",
    "msgpack>=1.1.1",
    "pandarallel>=1.6.5",
    "pandas>=2.3.1",
    "pdfplumber>=0.11.8",
    "pyarrow-hotfix>=0.7",
    "pycocotools>=2.0.10",
    "pyyaml>=6.0.2",
    "ray>=2.47.1",
    "requests>=2.32.4",
    "ruff==0.14.6",
    "sacremoses>=0.1.1",
    "scikit-learn>=1.7.0",
    "textdistance>=4.2.0",
    "tqdm>=4.67.1",
    "transformers>=4.53.3",
    "webdataset>=1.0.2",
    "wids>=0.1.11",
]

[project.optional-dependencies]
test = ["coverage", "pytest"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py313"
extend-exclude = ["alembic"]
preview = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
    "E501",  # line too long, handled by formatter
    "D100", "D104",  # docstring warnings
]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["./src", "."]
addopts = "-rXs --strict-config --strict-markers --tb=short --import-mode=importlib"

[project.urls]
Homepage = "https://github.com/atriaml/atria_datasets/"
Source = "https://github.com/atriaml/atria_datasets/"
BugReports = "https://github.com/atriaml/atria_datasets/"

[tool.mypy]
ignore_missing_imports = true
strict = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
# pymupdf ships no type information, so every call into it reads as untyped.
# Scoped to that package only -- calls into everything else stay checked.
untyped_calls_exclude = ["pymupdf"]

[dependency-groups]
dev = [
    "coverage>=7.12.0",
    "pytest>=9.0.1",
    "ruff>=0.14.6",
    "mypy>=1.18.2",
    "types-PyYAML>=6.0.0",
]

[tool.uv.sources]
datadings = { git = "https://github.com/saifullah3396/datadings.git" }
atria-core = { git = "https://github.com/atriaml/atria_core.git" }

[tool.uv]
managed = true

[project.scripts]
atria_datasets = "atria_datasets.cli:main"
