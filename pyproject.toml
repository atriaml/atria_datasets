[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atria_datasets"
version = "0.0.0"
description = "Atria Datasets: A collection of datasets for training and evaluating AI agents in the Atria framework."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE.txt" }
authors = [{ name = "Saifullah", email = "saifullah.saifullah@dfki.de" }]
dependencies = [
    "atria-core",
    "img2pdf>=0.6.3",
]

[project.optional-dependencies]
test = ["coverage", "pytest"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py313"
extend-exclude = ["alembic"]
preview = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
    "E501", # line too long, handled by formatter
    "D100",
    "D104", # docstring warnings
]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["./src", "."]
addopts = "-rXs --strict-config --strict-markers --tb=short --import-mode=importlib"

[project.urls]
Homepage = "https://github.com/atriaml/atria_datasets/"
Source = "https://github.com/atriaml/atria_datasets/"
BugReports = "https://github.com/atriaml/atria_datasets/"

[tool.mypy]
ignore_missing_imports = true
strict = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
# pymupdf ships no type information, so every call into it reads as untyped.
# Scoped to that package only -- calls into everything else stay checked.
untyped_calls_exclude = ["pymupdf"]

[dependency-groups]
dev = [
    "coverage>=7.12.0",
    "pytest>=9.0.1",
    "ruff>=0.14.6",
    "mypy>=1.18.2",
    "types-PyYAML>=6.0.0",
    "ipykernel>=7.3.0",
]

[tool.uv.sources]
datadings = { git = "https://github.com/saifullah3396/datadings.git" }
atria-core = { path = "../atria_core", editable = true }
# atria-core = { path = "../atria_core", editable = true }

[tool.uv]
managed = true

[project.scripts]
atria_datasets = "atria_datasets.cli:main"
